[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-supervisor"
version = "0.1.0"
description = "Supervisor, launcher and statusline for multiple Claude Code profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ccs = "ccs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/ccs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: uses the real claude binary; skipped unless CCS_TEST_LIVE=1",
]
