[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-supervisor"
version = "0.1.0"
description = "Supervisor, launcher and statusline for multiple Claude Code profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "coverage>=7.10"]

[project.scripts]
ccs = "ccs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
# ccs, and the scripts that import its internals (a rename in ccs must fail `make lint`).
# `make lint` checks tests/ in a second, relaxed run (see MYPY_TESTS in the Makefile).
files = ["src/ccs", "../scripts"]
mypy_path = "src"

[tool.coverage.run]
source = ["ccs"]
branch = true
# tests drive the CLI, daemon and launcher as child processes: measure those too
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
skip_empty = true
precision = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: uses the real claude binary; skipped unless CCS_TEST_LIVE=1",
    "perf: timing budget checks (statusline p95)",
]
